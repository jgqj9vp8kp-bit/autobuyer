# Render Blueprint: dashboard → New → Blueprint → выбрать репозиторий → Apply.
# Секретные переменные (sync: false) Render спросит при создании.
#
# Бесплатный тариф: сервис засыпает без трафика (первый запрос после паузы ~30–60 с) и не имеет
# постоянного диска, поэтому правила скоринга хранятся в Upstash Redis (KV_REST_API_URL/TOKEN,
# бесплатный тариф Upstash). Платный Starter: можно вместо Redis добавить диск на /data (см. DEPLOY.md).
services:
  - type: web
    name: autobuyer
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_MODE
        value: live
      - key: CAPSULED_API_URL
        value: https://capsuled.space/api/external/v1
      - key: CAPSULED_API_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://ph.app-inkfolio-reader.pro
      - key: POSTHOG_PROJECT_ID
        value: "1"
      - key: POSTHOG_API_KEY
        sync: false
      - key: BASIC_AUTH_USER
        value: team
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false
