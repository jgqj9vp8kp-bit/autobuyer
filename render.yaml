# Render Blueprint: dashboard → New → Blueprint → выбрать репозиторий → Apply.
# Секретные переменные (sync: false) Render спросит при создании.
#
# Бесплатный тариф web-сервиса: засыпает без трафика (первый запрос после паузы ~30–60 с) и не имеет
# постоянного диска. Правила скоринга поэтому живут в Key Value (Redis) Render — адрес подключения
# Render подставляет в REDIS_URL сам. У бесплатного Key Value нет персистентности на диск: при его
# перезапуске правила вернутся к значениям по умолчанию. Надёжнее — Upstash Redis
# (KV_REST_API_URL / KV_REST_API_TOKEN в Environment, тогда REDIS_URL игнорируется) или платный тариф.
services:
  - type: web
    name: autobuyer
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_MODE
        value: live
      - key: CAPSULED_API_URL
        value: https://capsuled.space/api/external/v1
      - key: CAPSULED_API_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://ph.app-inkfolio-reader.pro
      - key: POSTHOG_PROJECT_ID
        value: "1"
      - key: POSTHOG_API_KEY
        sync: false
      - key: BASIC_AUTH_USER
        value: team
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autobuyer-kv
          property: connectionString

  - type: keyvalue
    name: autobuyer-kv
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: [] # только внутренняя сеть Render
